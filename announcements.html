<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LRT Mutiara Updation – Announcements</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <h1 class="page-title">Construction announcements</h1>
    <p class="lead">Search or filter to find updates for your area.</p>

    <form class="filters" id="filters" aria-label="Filter announcements" onsubmit="return false">
      <div><label for="q">Search</label><input id="q" type="search" placeholder="e.g. piling, bus stop"></div>
      <div><label for="loc">Location</label><select id="loc"></select></div>
      <div><label for="cat">Category</label><select id="cat"></select></div>
      <div><label for="from">Posted from</label><input id="from" type="date"></div>
      <div><label for="to">Posted to</label><input id="to" type="date"></div>
      <div><button type="button" class="ghost" id="clear">Clear filters</button></div>
    </form>

    <p class="meta" id="count" aria-live="polite"></p>
    <div class="grid cols-2" id="list"></div>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/announcements.js"></script>
</body>
</html>
