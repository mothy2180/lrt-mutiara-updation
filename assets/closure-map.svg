<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Arial, sans-serif">
  <title>Schematic map of LRT Mutiara Line road closures, Penang island</title>
  <desc>Not to scale. Four closed road sections in red, each with a dashed green alternative route: Jalan Penang and Jalan Magazine in George Town and Komtar, Jalan Jelutong service road in Jelutong, and Jalan Mahsuri in Bayan Baru.</desc>

  <!-- sea -->
  <rect width="900" height="520" fill="#cfe3f3"/>
  <text x="760" y="260" font-size="16" fill="#5d88aa" font-style="italic" text-anchor="middle">Penang Strait</text>

  <!-- land -->
  <path d="M0 0 H650 C670 80 610 140 630 200 C650 270 570 330 590 400 C600 450 570 500 550 520 H0 Z" fill="#eef2e4" stroke="#b9c7a0" stroke-width="2"/>

  <!-- minor roads -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M40 160 H600"/>
    <path d="M40 330 H560"/>
    <path d="M120 0 V520"/>
    <path d="M520 20 V500"/>
  </g>
  <g stroke="#d8dfcd" stroke-width="2" fill="none">
    <path d="M40 160 H600"/><path d="M40 330 H560"/><path d="M120 0 V520"/><path d="M520 20 V500"/>
  </g>

  <!-- LRT Mutiara line (dotted) -->
  <path d="M470 30 C420 140 330 190 300 270 C270 350 250 400 240 500" stroke="#0a5db0" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" fill="none" opacity=".55"/>

  <!-- alternatives (green dashed) -->
  <g stroke="#1a7f49" stroke-width="6" stroke-dasharray="14 9" stroke-linecap="round" fill="none">
    <path d="M150 112 H340"/>
    <path d="M488 60 V190"/>
    <path d="M200 262 H400"/>
    <path d="M160 462 H360"/>
  </g>

  <!-- closures (red) -->
  <g stroke="#b3261e" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M150 78 H340"/>
    <path d="M450 60 V190"/>
    <path d="M200 228 H400"/>
    <path d="M160 428 H360"/>
  </g>

  <!-- road labels -->
  <g font-size="14" font-weight="600" fill="#17222f">
    <text x="150" y="68">Jalan Penang</text>
    <text x="395" y="52" text-anchor="end">Jalan Magazine</text>
    <text x="200" y="218">Jalan Jelutong (service road)</text>
    <text x="160" y="418">Jalan Mahsuri</text>
  </g>

  <!-- area pins -->
  <g font-size="15" font-weight="700" fill="#073f78">
    <circle cx="450" cy="30" r="7" fill="#073f78"/><text x="462" y="28">George Town / Komtar</text>
    <circle cx="140" cy="228" r="7" fill="#073f78"/><text x="152" y="206">Jelutong</text>
    <circle cx="120" cy="330" r="7" fill="#073f78"/><text x="132" y="352">Gelugor</text>
    <circle cx="120" cy="428" r="7" fill="#073f78"/><text x="132" y="400">Bayan Baru</text>
  </g>

  <!-- compass -->
  <g transform="translate(850 60)">
    <circle r="22" fill="#fff" stroke="#9fb3c6"/>
    <path d="M0 -16 L6 6 L0 2 L-6 6 Z" fill="#073f78"/>
    <text y="-26" font-size="13" font-weight="700" text-anchor="middle" fill="#073f78">N</text>
  </g>

  <!-- legend -->
  <g transform="translate(640 400)">
    <rect width="240" height="104" rx="10" fill="#fff" stroke="#c5d0dc"/>
    <line x1="16" y1="26" x2="56" y2="26" stroke="#b3261e" stroke-width="9" stroke-linecap="round"/>
    <text x="68" y="31" font-size="14" fill="#17222f">Closed road</text>
    <line x1="16" y1="52" x2="56" y2="52" stroke="#1a7f49" stroke-width="6" stroke-dasharray="14 9" stroke-linecap="round"/>
    <text x="68" y="57" font-size="14" fill="#17222f">Alternative route</text>
    <line x1="16" y1="78" x2="56" y2="78" stroke="#0a5db0" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" opacity=".7"/>
    <text x="68" y="83" font-size="14" fill="#17222f">LRT Mutiara Line (approx.)</text>
  </g>

  <text x="16" y="506" font-size="12" fill="#5a6b7c">Schematic prototype map, not to scale</text>
</svg>
